services:

  # ─── Proxy Docker sécurisé ──────────────────────────────────────────────
  # Seul ce conteneur a accès au vrai socket Docker.
  # Il expose une API filtrée à Jarvis : uniquement les endpoints autorisés.
  # Jarvis ne peut JAMAIS voir le socket brut.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      # Lecture seule autorisée
      CONTAINERS: 1   # lister, inspecter
      IMAGES: 0       # interdit
      NETWORKS: 0     # interdit
      VOLUMES: 0      # interdit
      # Actions autorisées sur les conteneurs
      POST: 1         # nécessaire pour start/stop/restart
      # Tout le reste est interdit par défaut (EXEC, BUILD, etc.)
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      SECRETS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-net
    # Ce conteneur ne parle pas au réseau principal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─── Jarvis Agent ────────────────────────────────────────────────────────
  jarvis:
    build:
      context: ./jarvis
      dockerfile: Dockerfile
    container_name: jarvis
    restart: unless-stopped
    env_file: .env
    environment:
      # Jarvis parle au proxy, PAS au vrai socket
      DOCKER_HOST: "tcp://docker-proxy:2375"
    ports:
      - "8080:8080"
    volumes:
      - jarvis-data:/app/data
      - jarvis-workspace:/app/workspace
      # PAS de /var/run/docker.sock ici — c'est le proxy qui gère
    networks:
      - jarvis-net
      - docker-proxy-net
    depends_on:
      - docker-proxy
    security_opt:
      - no-new-privileges:true   # interdit l'escalade de privilèges
    cap_drop:
      - ALL                      # retire TOUTES les capabilities Linux
    cap_add:
      - SETUID                   # nécessaire pour l'utilisateur jarvis
      - SETGID
    labels:
      - "jarvis.manageable=false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Open WebUI ──────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: "http://jarvis:8080/v1"
      OPENAI_API_KEY: "jarvis-local"
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: "jarvis-secret-change-me"
      WEBUI_AUTH: "false"
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - jarvis
    networks:
      - jarvis-net
    security_opt:
      - no-new-privileges:true
    labels:
      - "jarvis.manageable=false"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─── Caddy Reverse Proxy ─────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - jarvis-net
      - projects-net
    security_opt:
      - no-new-privileges:true
    labels:
      - "jarvis.manageable=false"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─── Ollama (SLM local) ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - jarvis-net
    security_opt:
      - no-new-privileges:true
    labels:
      - "jarvis.manageable=false"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  jarvis-data:
  jarvis-workspace:
  open-webui-data:
  caddy-data:
  caddy-config:
  ollama-data:

networks:
  jarvis-net:
    name: jarvis-net
  projects-net:
    name: projects-net
  # Réseau isolé uniquement pour Jarvis <-> docker-proxy
  # Aucun autre conteneur n'y a accès
  docker-proxy-net:
    name: docker-proxy-net
    internal: true   # pas de sortie Internet depuis ce réseau
