services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      POST: 1
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      SECRETS: 0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - docker-proxy-net
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      LM_STUDIO_MODEL: qwen/qwen3.5-9b
    ports:
    - 8080:8080
    volumes:
    - jarvis-data:/app/data
    - jarvis-workspace:/app/workspace
    - ./src/jarvis:/app/jarvis:ro
    - ./src/jarvis/tools:/app/jarvis/tools:rw
    - ./data/ssh:/root/.ssh:ro
    - ./:/repo:rw
    networks:
    - jarvis-net
    - docker-proxy-net
    depends_on:
    - docker-proxy
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    labels:
    - jarvis.manageable=false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: http://jarvis:8080/v1
      OPENAI_API_KEY: ${JARVIS_API_KEY}
      ENABLE_OLLAMA_API: 'false'
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: 'false'
    ports:
    - 3000:8080
    volumes:
    - open-webui-data:/app/backend/data
    depends_on:
    - jarvis
    networks:
    - jarvis-net
    security_opt:
    - no-new-privileges:true
    labels:
    - jarvis.manageable=false
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy-data:/data
    - caddy-config:/config
    networks:
    - jarvis-net
    - projects-net
    security_opt:
    - no-new-privileges:true
    labels:
    - jarvis.manageable=false
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_NUM_THREADS: 8
    volumes:
    - ollama-data:/root/.ollama
    networks:
    - jarvis-net
    security_opt:
    - no-new-privileges:true
    labels:
    - jarvis.manageable=false
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  chromium:
    image: ghcr.io/browserless/chromium:latest
    container_name: chromium
    restart: unless-stopped
    environment:
    - CONCURRENT=5
    - QUEUE=5
    - TIMEOUT=30000
    networks:
    - jarvis-net
    security_opt:
    - no-new-privileges:true
    labels:
    - jarvis.manageable=false
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    ports:
    - 9443:9443
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer-data:/data
    networks:
    - jarvis-net
    labels:
    - jarvis.manageable=false
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  jarvis-live:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-live
    restart: unless-stopped
    env_file: .env
    environment:
      LM_STUDIO_MODEL: qwen/qwen3.5-9b
    command: python3 -m jarvis.interfaces.live_agent start
    healthcheck:
      disable: true
    networks:
    - jarvis-net
    depends_on:
    - docker-proxy
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper
    restart: unless-stopped
    environment:
    - ASR_MODEL=tiny
    - ASR_ENGINE=openai_whisper
    networks:
    - jarvis-net
    security_opt:
    - no-new-privileges:true
    labels:
    - jarvis.manageable=false
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: jarvis-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jarvis_secret}
      POSTGRES_DB: jarvis_memory
    shm_size: 256mb
    command:
    - postgres
    - -c
    - shared_buffers=256MB
    - -c
    - maintenance_work_mem=256MB
    volumes:
    - jarvis-db-data:/var/lib/postgresql/data
    - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
    - jarvis-net
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
    - jarvis.manageable=false
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
volumes:
  jarvis-data: null
  jarvis-workspace: null
  open-webui-data: null
  caddy-data: null
  caddy-config: null
  ollama-data: null
  portainer-data: null
  jarvis-db-data: null
networks:
  jarvis-net:
    name: jarvis-net
  projects-net:
    name: projects-net
  docker-proxy-net:
    name: docker-proxy-net
    internal: true
